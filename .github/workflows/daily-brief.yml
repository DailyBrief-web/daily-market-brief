name: Daily Market Brief

on:
  schedule:
    # Dwie proby dziennie (nie trzy) - zmniejszamy laczna liczbe zapytan do
    # Gemini, bo darmowy limit (zwlaszcza dla funkcji wyszukiwania uzywanej
    # przy indeksach) latwo sie wyczerpuje przy zbyt wielu uruchomieniach.
    # Zapasowe uruchomienie przesuniete na 08:00 UTC - to zwykle chwila po
    # tym, jak Google resetuje dzienne limity (ok. polnocy czasu Pacyficznego),
    # wiec ma najlepsza szanse zlapac "swiezy" limit, jesli poprzednie
    # uruchomienie zawiodlo z powodu jego wyczerpania.
    - cron: '0 22 * * *'   # 22:00 UTC - glowne, po zamknieciu sesji US
    - cron: '0 8 * * *'    # 08:00 UTC - zapasowe, po resecie limitu Gemini
  workflow_dispatch: {}   # pozwala odpalic recznie z zakladki Actions

permissions:
  contents: write

jobs:
  build-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generuj dzisiejszy brief
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python generate_brief.py

      - name: Zapisz dane do repo
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Brief: $(date -u +%Y-%m-%d)"
          git push
