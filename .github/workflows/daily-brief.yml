name: Daily Market Brief

on:
  schedule:
    # Glowne uruchomienie: 22:00 UTC w dni robocze, po zamknieciu sesji US
    - cron: '0 22 * * 1-5'
    # Zapasowe uruchomienie: 2h pozniej, na wypadek gdyby glowne nie zdobylo
    # wszystkich danych (np. Gemini akurat nie odpowiadal). Dzieki logice w
    # generate_brief.py, to uruchomienie dopelni tylko to, czego brakuje.
    - cron: '0 0 * * 2-6'
  workflow_dispatch: {}   # pozwala odpalic recznie z zakladki Actions

permissions:
  contents: write

jobs:
  build-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generuj dzisiejszy brief
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_brief.py

      - name: Zapisz dane do repo
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Brief: $(date -u +%Y-%m-%d)"
          git push
