name: Daily Market Brief

on:
  schedule:
    # Trzy proby dziennie, KAZDEGO dnia tygodnia (rowniez weekendy - polityka
    # i gospodarka "dzieja sie" niezaleznie od tego czy gielda ma sesje).
    # Trzy proby zamiast jednej/dwoch zabezpieczaja przed sytuacja, w ktorej
    # GitHub Actions "zgubi" pojedyncze zaplanowane uruchomienie (znane,
    # udokumentowane ograniczenie darmowego planu - harmonogram cron nie jest
    # w 100% gwarantowany). Dzieki logice w generate_brief.py kazde kolejne
    # uruchomienie tego samego dnia jest bezpieczne - albo nic nie robi (jesli
    # poprzednie juz wszystko zapisalo), albo dopelnia tylko brakujace czesci.
    - cron: '0 22 * * *'   # 22:00 UTC - glowne, po zamknieciu sesji US
    - cron: '0 0 * * *'    # 00:00 UTC - 1. zapasowe
    - cron: '0 6 * * *'    # 06:00 UTC - 2. zapasowe
  workflow_dispatch: {}   # pozwala odpalic recznie z zakladki Actions

permissions:
  contents: write

jobs:
  build-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generuj dzisiejszy brief
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python generate_brief.py

      - name: Zapisz dane do repo
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Brief: $(date -u +%Y-%m-%d)"
          git push
